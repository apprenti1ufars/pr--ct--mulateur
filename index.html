<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulateur de contrôle technique — VL 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bay:#12202b;        /* acier sombre de l'atelier */
  --bay-2:#1c3040;
  --paper:#f5f3ee;      /* feuille de contrôle */
  --paper-2:#ffffff;
  --ink:#16202a;
  --ink-soft:#5c6b78;
  --rule:#d7d2c7;
  --min:#1f8a54;        /* mineure */
  --maj:#c97a10;        /* majeure */
  --cri:#c0392f;        /* critique */
  --ok:#2f7fb5;
  --focus:#f2b705;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bay:#0c161d;--bay-2:#16252f;--paper:#141b21;--paper-2:#1a232b;
    --ink:#e8ecef;--ink-soft:#97a6b2;--rule:#2b3841;
    --min:#3fbd7d;--maj:#e5a13c;--cri:#e2685c;--ok:#5aa9d8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bay:#0c161d;--bay-2:#16252f;--paper:#141b21;--paper-2:#1a232b;
  --ink:#e8ecef;--ink-soft:#97a6b2;--rule:#2b3841;
  --min:#3fbd7d;--maj:#e5a13c;--cri:#e2685c;--ok:#5aa9d8;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ---------- Bandeau véhicule ---------- */
header.bay{background:var(--bay);color:#eef3f6;padding:14px 18px 0;}
.bay-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;max-width:1240px;margin:0 auto;}
.bay-top h1{font-size:1.05rem;font-weight:800;letter-spacing:-.01em;margin:0;}
.bay-top .sub{font-size:.8rem;color:#8fa6b5;margin:0;}
.bay-top .spacer{flex:1}
.ghost{background:transparent;border:1px solid #395264;color:#cfe0ea;border-radius:999px;padding:5px 12px;font-size:.78rem}
.ghost:hover{background:#22384a}
.plate{display:flex;align-items:stretch;border-radius:5px;overflow:hidden;border:2px solid #0a0a0a;background:#fff;box-shadow:0 1px 0 #000;}
.plate .eu{background:#0a3a9c;color:#ffd200;font-size:.55rem;width:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px;font-weight:600}
.plate .eu::before{content:"★";font-size:.6rem;color:#ffd200;margin-bottom:auto;margin-top:3px}
.plate input{border:0;background:transparent;color:#111;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:1rem;width:9.5ch;text-align:center;padding:5px 2px;text-transform:uppercase}
.plate input:focus{outline:none;background:#fff8d8}
.veh{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 14px;max-width:1240px;margin:12px auto 0;padding-bottom:14px}
.veh label{display:block;font-size:.7rem;color:#8fa6b5;margin-bottom:2px}
.veh input,.veh select{width:100%;background:var(--bay-2);border:1px solid #2f4757;color:#eef3f6;border-radius:6px;padding:6px 8px;font-size:.85rem}

/* ---------- Bande de progression ---------- */
.strip{background:var(--bay-2);border-top:1px solid #2b4152;position:sticky;top:0;z-index:30}
.strip-in{max-width:1240px;margin:0 auto;display:flex;gap:6px;padding:8px 12px;overflow-x:auto;scrollbar-width:thin}
.blk{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:#1a2e3d;border:1px solid #2f4757;color:#c8d9e4;border-radius:7px;padding:6px 10px;white-space:nowrap}
.blk[aria-current="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.blk .num{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.95rem;width:1.1em;text-align:center}
.blk .lbl{font-size:.78rem;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.blk .ct{font-size:.68rem;opacity:.75;font-family:"IBM Plex Mono",monospace}
.blk .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.m{background:var(--min)}.dot.M{background:var(--maj)}.dot.C{background:var(--cri)}
.blk.done{border-color:var(--ok)}

/* ---------- Corps ---------- */
main{max-width:1240px;margin:0 auto;padding:18px 12px 150px}
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-row input{flex:1 1 240px;min-width:0;padding:9px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper-2);color:var(--ink)}
.filter{display:flex;gap:4px}
.filter button{border:1px solid var(--rule);background:var(--paper-2);border-radius:8px;padding:8px 10px;font-size:.78rem}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.blockhead{display:flex;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:14px}
.blockhead .f{font-family:"IBM Plex Mono",monospace;font-size:2.6rem;font-weight:600;line-height:.9}
.blockhead h2{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.blockhead .meta{margin-left:auto;font-size:.78rem;color:var(--ink-soft);text-align:right}

.pt{background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;overflow:hidden}
.pt.state-ok{border-left:5px solid var(--ok)}
.pt.state-m{border-left:5px solid var(--min)}
.pt.state-M{border-left:5px solid var(--maj)}
.pt.state-C{border-left:5px solid var(--cri)}
summary.pt-head{list-style:none}
summary.pt-head::-webkit-details-marker{display:none}
.pt-head{display:flex;align-items:center;gap:10px;padding:11px 12px;width:100%;background:none;border:0;text-align:left}
.pt-head .ens{font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-soft);flex:0 0 auto}
.pt-head .nm{font-size:.94rem;font-weight:500;flex:1}
.pt-head .tag{font-size:.7rem;border-radius:999px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.tag.ok{color:var(--ok)}.tag.m{color:var(--min)}.tag.M{color:var(--maj)}.tag.C{color:var(--cri)}.tag.non{color:var(--ink-soft)}
.pt-head .chev{color:var(--ink-soft);transition:transform .18s ease}
.pt[open] .chev{transform:rotate(90deg)}
.pt-body{padding:0 12px 12px;border-top:1px dashed var(--rule)}
.conf{display:inline-flex;align-items:center;gap:8px;margin:12px 0 8px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--ok);color:var(--ok);background:transparent;font-size:.85rem;font-weight:500}
.conf[aria-pressed="true"]{background:var(--ok);color:#fff}
.deflist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.deflist li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.deflist li.on{background:color-mix(in srgb,var(--sev) 12%,var(--paper-2));border-color:var(--sev)}
.deflist input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--sev);flex:0 0 auto}
.deflist label{flex:1;cursor:pointer;font-size:.87rem}
.deflist .code{display:block;font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-soft)}
.sev{flex:0 0 auto;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;color:#fff;background:var(--sev);height:fit-content}
li.m{--sev:var(--min)}li.M{--sev:var(--maj)}li.C{--sev:var(--cri)}
.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.navbtns button{border:1px solid var(--rule);background:var(--paper-2);border-radius:8px;padding:10px 16px;font-size:.85rem}
.navbtns button:disabled{opacity:.4;cursor:default}
.hint{color:var(--ink-soft);font-size:.82rem;margin:0 0 14px}
.res-from{font-size:.72rem;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace}

/* ---------- Barre verdict ---------- */
.verdict{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bay);color:#eef3f6;border-top:3px solid var(--vcol,#2f4757);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.verdict-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.counts{display:flex;gap:8px}
.cbox{display:flex;flex-direction:column;align-items:center;min-width:46px;border-radius:7px;padding:3px 8px;background:#1b2f3e;border-bottom:3px solid var(--c)}
.cbox b{font-family:"IBM Plex Mono",monospace;font-size:1.05rem}
.cbox span{font-size:.62rem;color:#93a9b7}
.vlabel{font-weight:800;font-size:1rem;color:var(--vcol,#cfe0ea)}
.vsub{font-size:.75rem;color:#93a9b7;max-width:46ch}
.verdict .acts{margin-left:auto;display:flex;gap:8px}
.verdict .acts button{border-radius:8px;padding:8px 14px;font-size:.82rem;border:1px solid #3d586c;background:#1e3547;color:#dcebf4}
.verdict .acts .primary{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:600}

/* ---------- PV ---------- */
dialog{border:0;border-radius:12px;padding:0;max-width:820px;width:calc(100% - 24px);background:var(--paper-2);color:var(--ink)}
dialog::backdrop{background:rgba(6,14,20,.6)}
.pv{padding:22px}
.pv h2{margin:0 0 2px;font-size:1.2rem}
.pv .pvsub{color:var(--ink-soft);font-size:.8rem;margin:0 0 16px}
.pv table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px}
.pv th,.pv td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.pv th{font-weight:600;color:var(--ink-soft);font-size:.72rem}
.pv .wrap{overflow-x:auto}
.pvbanner{border-left:5px solid var(--vcol);padding:10px 14px;background:color-mix(in srgb,var(--vcol) 10%,transparent);border-radius:0 8px 8px 0;margin-bottom:16px}
.pvbanner b{color:var(--vcol);display:block;font-size:1rem}
.pvbanner span{font-size:.82rem;color:var(--ink-soft)}
.pvacts{display:flex;gap:8px;justify-content:flex-end}
.pvacts button{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 14px;font-size:.82rem}
.legal{font-size:.7rem;color:var(--ink-soft);margin-top:14px;line-height:1.4}
@media print{
  header.bay,.strip,main,.verdict,.pvacts{display:none!important}
  dialog{position:static;width:100%;max-width:none;box-shadow:none}
  body{background:#fff}
}
@media (max-width:640px){
  .blockhead .f{font-size:1.8rem}
  .verdict .acts{width:100%;margin-left:0}
  .verdict .acts button{flex:1}
  .vsub{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bay">
  <div class="bay-top">
    <div>
      <h1>Simulateur de contrôle technique périodique</h1>
      <p class="sub">Véhicule léger ≤ 3,5 t — référentiel en vigueur au 1<sup>er</sup> janvier 2026 · <span id="stats">…</span></p>
    </div>
    <div class="spacer"></div>
    <div class="plate" title="Immatriculation"><span class="eu">F</span><input id="immat" value="AB-123-CD" maxlength="9" aria-label="Immatriculation"></div>
    <button class="ghost" id="themeBtn" type="button">Thème</button>
  </div>
  <div class="veh">
    <div><label for="marque">Marque et modèle</label><input id="marque" placeholder="Renault Clio IV"></div>
    <div><label for="vin">N° de série (VIN)</label><input id="vin" placeholder="VF1R…"></div>
    <div><label for="mec">1<sup>re</sup> mise en circulation</label><input id="mec" type="date"></div>
    <div><label for="km">Kilométrage</label><input id="km" type="number" inputmode="numeric" placeholder="128 400"></div>
    <div><label for="energie">Énergie</label><select id="energie"><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option><option>GPL</option></select></div>
    <div><label for="ctrl">Date du contrôle</label><input id="ctrl" type="date"></div>
  </div>
</header>

<nav class="strip" aria-label="Blocs de contrôle"><div class="strip-in" id="strip"></div></nav>

<main>
  <div class="search-row">
    <input id="q" type="search" placeholder="Chercher un code (1.1.13.a.2), un point ou une défaillance…" aria-label="Rechercher dans le référentiel">
    <div class="filter" role="group" aria-label="Filtrer par gravité">
      <button type="button" data-sev="m" aria-pressed="false">Mineures</button>
      <button type="button" data-sev="M" aria-pressed="false">Majeures</button>
      <button type="button" data-sev="C" aria-pressed="false">Critiques</button>
    </div>
  </div>
  <div id="view"></div>
</main>

<div class="verdict" id="verdict">
  <div class="verdict-in">
    <div class="counts">
      <div class="cbox" style="--c:var(--ok)"><b id="cOk">0</b><span>vus</span></div>
      <div class="cbox" style="--c:var(--min)"><b id="cMin">0</b><span>mineures</span></div>
      <div class="cbox" style="--c:var(--maj)"><b id="cMaj">0</b><span>majeures</span></div>
      <div class="cbox" style="--c:var(--cri)"><b id="cCri">0</b><span>critiques</span></div>
    </div>
    <div>
      <div class="vlabel" id="vLabel">Contrôle non commencé</div>
      <div class="vsub" id="vSub">Ouvrez le bloc 0 et déclarez chaque point conforme ou défaillant.</div>
    </div>
    <div class="acts">
      <button type="button" id="resetBtn">Nouveau contrôle</button>
      <button type="button" class="primary" id="pvBtn">Voir le procès-verbal</button>
    </div>
  </div>
</div>

<dialog id="pvDlg" aria-labelledby="pvTitle"><div class="pv" id="pvBody"></div></dialog>

<script>

nt de contrôle des émissions — moteur à allumage par compression", "defs": [{"c": "8.2.2.1.a.2", "l": "Équipement antipollution monté par le constructeur manquant, modifié ou manifestement défectueux", "n": "M"}, {"c": "8.2.2.1.b.2", "l": "Témoin de dysfonctionnement (MIL) ne fonctionnant pas correctement", "n": "M"}, {"c": "8.2.2.1.c.2", "l": "Filtre à particules modifié, retiré ou manifestement défectueux", "n": "M"}]}, {"ens": "8.2.2.2", "nom": "Opacité des fumées — moteur à allumage par compression", "defs": [{"c": "8.2.2.2.a.2", "l": "Opacité supérieure au niveau indiqué sur la plaque du constructeur", "n": "M"}, {"c": "8.2.2.2.b.2", "l": "En l'absence d'indication, coefficient d'absorption supérieur aux valeurs réglementaires", "n": "M"}, {"c": "8.2.2.2.c.2", "l": "Fumées d'une densité excessive empêchant la mesure", "n": "M"}]}, {"ens": "8.4.1", "nom": "Fuites de fluide et autres éléments liés à l'environnement", "defs": [{"c": "8.4.1.a.1", "l": "Fuite de fluide susceptible de nuire à l'environnement ou de présenter un risque pour les autres usagers", "n": "m"}, {"c": "8.4.1.a.2", "l": "Formation continue de gouttes constituant un risque important", "n": "M"}]}]}];
const SEVNAME = {m:"Mineure", M:"Majeure", C:"Critique"};
const NPTS = DATA.reduce((a,b)=>a+b.points.length,0);
const NDEF = DATA.reduce((a,b)=>a+b.points.reduce((x,p)=>x+p.defs.length,0),0);
const LS = "ct2026-session-v1";
let state = { veh:{}, points:{}, block:0, sev:{}, q:"" };

/* ---------- persistance ---------- */
function save(){
  try{ localStorage.setItem(LS, JSON.stringify({veh:state.veh, points:state.points, block:state.block})); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(LS); if(!raw) return;
    const o = JSON.parse(raw);
    if(o && typeof o === "object"){ state.veh = o.veh||{}; state.points = o.points||{}; state.block = o.block||0; }
  }catch(e){}
}
const VFIELDS = ["immat","marque","vin","mec","km","energie","ctrl"];
function bindVehicle(){
  VFIELDS.forEach(id=>{
    const el = document.getElementById(id);
    if(state.veh[id] != null && state.veh[id] !== "") el.value = state.veh[id];
    el.addEventListener("input", ()=>{ state.veh[id] = el.value; save(); });
  });
  if(!document.getElementById("ctrl").value){
    const t = new Date(); document.getElementById("ctrl").value = t.toISOString().slice(0,10);
    state.veh.ctrl = document.getElementById("ctrl").value;
  }
}

/* ---------- état d'un point ---------- */
function pt(ens){ return state.points[ens] || {ok:false, defs:[]}; }
function ptState(ens){
  const p = pt(ens);
  if(p.defs.length){
    if(p.defs.some(c=>sevOf(c)==="C")) return "C";
    if(p.defs.some(c=>sevOf(c)==="M")) return "M";
    return "m";
  }
  return p.ok ? "ok" : "non";
}
const CODEMAP = {};
DATA.forEach(b=>b.points.forEach(p=>p.defs.forEach(d=>CODEMAP[d.c]={...d, ens:p.ens, point:p.nom, f:b.f, groupe:b.nom})));
function sevOf(code){ return CODEMAP[code] ? CODEMAP[code].n : "m"; }

function totals(){
  let seen=0, m=0, M=0, C=0;
  DATA.forEach(b=>b.points.forEach(p=>{
    const s = ptState(p.ens);
    if(s!=="non") seen++;
    pt(p.ens).defs.forEach(c=>{ const n=sevOf(c); if(n==="m")m++; else if(n==="M")M++; else C++; });
  }));
  return {seen, m, M, C, total:NPTS};
}
function verdict(){
  const t = totals();
  if(t.C>0) return {k:"R", col:"var(--cri)", label:"Défavorable — défaillance critique",
    sub:"Circulation autorisée jusqu'à minuit le jour du contrôle. Contre-visite à réaliser dans les 2 mois, après réparation."};
  if(t.M>0) return {k:"S", col:"var(--maj)", label:"Défavorable — contre-visite",
    sub:"Le véhicule peut circuler 2 mois. Contre-visite obligatoire dans ce délai, sinon un contrôle complet est à refaire."};
  if(t.seen===0) return {k:"-", col:"#6d8598", label:"Contrôle non commencé", sub:"Ouvrez le bloc 0 et déclarez chaque point conforme ou défaillant."};
  if(t.seen<t.total) return {k:"…", col:"var(--ok)", label:"Contrôle en cours — "+t.seen+" / "+t.total+" points",
    sub:"Aucune défaillance majeure ni critique relevée à ce stade."};
  return {k:"A", col:"var(--min)", label:"Favorable" + (t.m?" — avec observations":""),
    sub: t.m ? "Les défaillances mineures sont signalées au conducteur mais n'imposent pas de contre-visite."
             : "Validité 2 ans pour un véhicule particulier."};
}

/* ---------- rendu bandeau blocs ---------- */
function renderStrip(){
  const el = document.getElementById("strip");
  el.innerHTML = "";
  DATA.forEach((b,i)=>{
    let seen=0, dots={m:0,M:0,C:0};
    b.points.forEach(p=>{ const s=ptState(p.ens); if(s!=="non") seen++; pt(p.ens).defs.forEach(c=>dots[sevOf(c)]++); });
    const btn = document.createElement("button");
    btn.className = "blk" + (seen===b.points.length ? " done":"");
    btn.type="button"; btn.setAttribute("aria-current", state.block===i ? "true":"false");
    btn.innerHTML = `<span class="num">${b.f}</span><span class="lbl">${b.nom}</span><span class="ct">${seen}/${b.points.length}</span>`;
    ["C","M","m"].forEach(k=>{ if(dots[k]){ const d=document.createElement("span"); d.className="dot "+k; d.title=dots[k]+" "+SEVNAME[k].toLowerCase(); btn.appendChild(d);} });
    btn.addEventListener("click", ()=>{ state.block=i; state.q=""; document.getElementById("q").value=""; save(); render(); window.scrollTo({top:0}); });
    el.appendChild(btn);
  });
  const cur = el.querySelector('[aria-current="true"]');
  if(cur) cur.scrollIntoView({block:"nearest", inline:"center"});
}

/* ---------- rendu d'un point ---------- */
function pointNode(p, blockLabel){
  const d = document.createElement("details");
  d.className = "pt state-" + ptState(p.ens).replace("non","");
  d.id = "pt-" + p.ens;
  const st = ptState(p.ens);
  const tagTxt = st==="ok" ? "Conforme" : st==="non" ? "Non contrôlé" : (pt(p.ens).defs.length + " défaillance" + (pt(p.ens).defs.length>1?"s":""));
  const tagCls = st==="non" ? "non" : st;
  const sum = document.createElement("summary");
  sum.className = "pt-head";
  sum.innerHTML = `<span class="ens">${p.ens}</span><span class="nm">${p.nom}</span>` +
    (blockLabel?`<span class="res-from">bloc ${blockLabel}</span>`:"") +
    `<span class="tag ${tagCls}">${tagTxt}</span><span class="chev">›</span>`;
  d.appendChild(sum);

  const body = document.createElement("div");
  body.className = "pt-body";
  const conf = document.createElement("button");
  conf.type="button"; conf.className="conf"; conf.setAttribute("aria-pressed", String(pt(p.ens).ok && !pt(p.ens).defs.length));
  conf.textContent = "Point conforme";
  conf.addEventListener("click", ()=>{
    const cur = pt(p.ens);
    state.points[p.ens] = cur.ok && !cur.defs.length ? {ok:false, defs:[]} : {ok:true, defs:[]};
    save(); render(p.ens);
  });
  body.appendChild(conf);

  const ul = document.createElement("ul");
  ul.className = "deflist";
  p.defs.forEach(def=>{
    const li = document.createElement("li");
    const checked = pt(p.ens).defs.includes(def.c);
    li.className = def.n + (checked?" on":"");
    const id = "cb-"+def.c.replace(/\./g,"_");
    li.innerHTML = `<input type="checkbox" id="${id}" ${checked?"checked":""}>
      <label for="${id}"><span class="code">${def.c}</span>${def.l}</label>
      <span class="sev">${SEVNAME[def.n]}</span>`;
    li.querySelector("input").addEventListener("change", e=>{
      const cur = {ok:false, defs:[...pt(p.ens).defs]};
      if(e.target.checked){ if(!cur.defs.includes(def.c)) cur.defs.push(def.c); }
      else cur.defs = cur.defs.filter(c=>c!==def.c);
      state.points[p.ens] = cur.defs.length ? {ok:false, defs:cur.defs} : {ok:true, defs:[]};
      save(); render(p.ens);
    });
    ul.appendChild(li);
  });
  body.appendChild(ul);
  d.appendChild(body);
  return d;
}

/* ---------- rendu principal ---------- */
function render(openEns){
  const view = document.getElementById("view");
  const activeSev = Object.keys(state.sev).filter(k=>state.sev[k]);
  const q = state.q.trim().toLowerCase();
  view.innerHTML = "";

  if(q || activeSev.length){
    const results = [];
    DATA.forEach(b=>b.points.forEach(p=>{
      const defs = p.defs.filter(d=>{
        const okSev = !activeSev.length || activeSev.includes(d.n);
        const okQ = !q || d.c.toLowerCase().includes(q) || d.l.toLowerCase().includes(q) || p.nom.toLowerCase().includes(q) || p.ens.includes(q) || b.nom.toLowerCase().includes(q);
        return okSev && okQ;
      });
      if(defs.length) results.push({p:{...p, defs}, b});
    }));
    const h = document.createElement("div");
    h.className = "blockhead";
    h.innerHTML = `<span class="f">⌕</span><h2>${results.length} point${results.length>1?"s":""} trouvé${results.length>1?"s":""}</h2>
      <span class="meta">${results.reduce((a,r)=>a+r.p.defs.length,0)} défaillances correspondantes</span>`;
    view.appendChild(h);
    if(!results.length){
      const p=document.createElement("p"); p.className="hint";
      p.textContent="Aucune correspondance. Essayez un numéro de code (par exemple 5.2.3) ou un mot comme « pneumatique », « freinage », « rétroviseur ».";
      view.appendChild(p);
    }
    results.forEach(r=>{ const n = pointNode(r.p, r.b.f); n.open = true; view.appendChild(n); });
  } else {
    const b = DATA[state.block];
    let seen=0; b.points.forEach(p=>{ if(ptState(p.ens)!=="non") seen++; });
    const h = document.createElement("div");
    h.className="blockhead";
    h.innerHTML = `<span class="f">${b.f}</span><h2>${b.nom}</h2>
      <span class="meta">${seen} / ${b.points.length} points contrôlés<br>${b.points.reduce((a,p)=>a+p.defs.length,0)} défaillances possibles</span>`;
    view.appendChild(h);
    b.points.forEach(p=>view.appendChild(pointNode(p)));

    const nav = document.createElement("div");
    nav.className="navbtns";
    const prev = document.createElement("button"); prev.type="button"; prev.textContent="‹ Bloc précédent"; prev.disabled = state.block===0;
    const next = document.createElement("button"); next.type="button";
    next.textContent = state.block===DATA.length-1 ? "Terminer et éditer le PV ›" : "Bloc suivant ›";
    prev.addEventListener("click", ()=>{ state.block--; save(); render(); window.scrollTo({top:0}); });
    next.addEventListener("click", ()=>{
      if(state.block===DATA.length-1){ openPV(); return; }
      state.block++; save(); render(); window.scrollTo({top:0});
    });
    nav.append(prev,next); view.appendChild(nav);
  }

  if(openEns){
    const d = document.getElementById("pt-"+openEns);
    if(d){ d.open = true; }
  }
  renderStrip(); renderVerdict();
}

function renderVerdict(){
  const t = totals(), v = verdict();
  document.getElementById("cOk").textContent = t.seen;
  document.getElementById("cMin").textContent = t.m;
  document.getElementById("cMaj").textContent = t.M;
  document.getElementById("cCri").textContent = t.C;
  const bar = document.getElementById("verdict");
  bar.style.setProperty("--vcol", v.col);
  document.getElementById("vLabel").textContent = v.label;
  document.getElementById("vSub").textContent = v.sub;
}

/* ---------- procès-verbal ---------- */
function openPV(){
  const t = totals(), v = verdict();
  const rows = [];
  DATA.forEach(b=>b.points.forEach(p=>pt(p.ens).defs.forEach(c=>{
    const d = CODEMAP[c]; if(d) rows.push({...d});
  })));
  rows.sort((a,b)=> ({C:0,M:1,m:2})[a.n] - ({C:0,M:1,m:2})[b.n]);
  const g = id => (document.getElementById(id).value || "—");
  const dateFR = s => s ? new Date(s).toLocaleDateString("fr-FR") : "—";
  const body = document.getElementById("pvBody");
  body.style.setProperty("--vcol", v.col);
  body.innerHTML = `
    <h2 id="pvTitle">Procès-verbal de contrôle technique — simulation</h2>
    <p class="pvsub">Contrôle périodique · véhicule léger · ${dateFR(document.getElementById("ctrl").value)}</p>
    <div class="pvbanner"><b>${v.label}</b><span>${v.sub}</span></div>
    <table>
      <tr><th>Immatriculation</th><td class="mono">${g("immat")}</td><th>Marque et modèle</th><td>${g("marque")}</td></tr>
      <tr><th>N° de série</th><td class="mono">${g("vin")}</td><th>1re mise en circulation</th><td>${dateFR(document.getElementById("mec").value)}</td></tr>
      <tr><th>Énergie</th><td>${g("energie")}</td><th>Kilométrage relevé</th><td>${g("km")} km</td></tr>
      <tr><th>Points contrôlés</th><td>${t.seen} / ${t.total}</td><th>Défaillances</th><td>${t.m} mineure(s) · ${t.M} majeure(s) · ${t.C} critique(s)</td></tr>
    </table>
    ${rows.length ? `<div class="wrap"><table>
      <thead><tr><th>Code</th><th>Point de contrôle</th><th>Constat</th><th>Gravité</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="mono">${r.c}</td><td>${r.point}</td><td>${r.l}</td><td style="color:var(--${r.n==="m"?"min":r.n==="M"?"maj":"cri"})">${SEVNAME[r.n]}</td></tr>`).join("")}</tbody>
    </table></div>` : `<p class="pvsub">Aucune défaillance relevée.</p>`}
    <div class="pvacts">
      <button type="button" id="dlHtml">Télécharger le PV (.html)</button>
      <button type="button" id="dlCsv">Exporter les constats (.csv)</button>
      <button type="button" onclick="window.print()">Imprimer</button>
      <button type="button" id="pvClose">Fermer</button>
    </div>
    <p class="legal">Simulation pédagogique bâtie sur l'annexe I de l'arrêté du 18 juin 1991 (version applicable au 1er janvier 2026) et la base documentaire UTAC-OTC pour véhicules légers. Ce document n'a aucune valeur réglementaire et ne remplace pas un contrôle réalisé dans un centre agréé. Les fonctions spécialisées 10 à 13 et les cas particuliers (véhicules de collection, gaz) ne sont pas couverts.</p>`;
  body.querySelector("#pvClose").addEventListener("click", ()=>document.getElementById("pvDlg").close());
  const plate = (document.getElementById("immat").value||"vehicule").replace(/[^A-Za-z0-9-]/g,"");
  body.querySelector("#dlHtml").addEventListener("click", e=>{
    const clone = body.cloneNode(true);
    const acts = clone.querySelector(".pvacts"); if(acts) acts.remove();
    const doc = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>PV contrôle technique ${plate}</title>
<style>body{font-family:Arial,Helvetica,sans-serif;color:#16202a;max-width:820px;margin:32px auto;padding:0 20px;line-height:1.45}
h2{font-size:1.2rem;margin:0 0 2px}table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #d7d2c7;vertical-align:top}
th{font-size:.75rem;color:#5c6b78}.pvsub{color:#5c6b78;font-size:.8rem;margin:0 0 16px}
.pvbanner{border-left:5px solid ${v.col.replace("var(--cri)","#c0392f").replace("var(--maj)","#c97a10").replace("var(--min)","#1f8a54").replace("var(--ok)","#2f7fb5")};padding:10px 14px;background:#f5f3ee;margin-bottom:16px}
.pvbanner b{display:block;font-size:1rem}.legal{font-size:.72rem;color:#5c6b78;line-height:1.4}
.mono{font-family:Consolas,monospace}</style></head><body>${clone.innerHTML}</body></html>`;
    offerDownload(`PV-controle-technique-${plate}.html`, doc, e.target);
  });
  body.querySelector("#dlCsv").addEventListener("click", e=>{
    const esc = x => `"${String(x).replace(/"/g,'""')}"`;
    const lines = [["Code","Bloc","Point de controle","Constat","Gravite"].map(esc).join(";")];
    rows.forEach(r=>lines.push([r.c, r.f+" - "+r.groupe, r.point, r.l, SEVNAME[r.n]].map(esc).join(";")));
    offerDownload(`constats-${plate}.csv`, "\ufeff"+lines.join("\r\n"), e.target);
  });
  document.getElementById("pvDlg").showModal();
}

/* ---------- téléchargement ---------- */
let dlNs;
async function offerDownload(filename, text, btn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = "Préparation…";
  try{
    if(dlNs === undefined) dlNs = window.claude && claude.use ? await claude.use("downloads") : null;
    if(dlNs){
      await dlNs.save({filename, data:text});
      btn.textContent = "Enregistré";
    } else {
      const url = URL.createObjectURL(new Blob([text], {type:"text/plain;charset=utf-8"}));
      const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      btn.textContent = "Téléchargé";
    }
  }catch(err){
    btn.textContent = err && err.code === "declined" ? "Annulé" : "Échec du téléchargement";
  }
  setTimeout(()=>{ btn.disabled = false; btn.textContent = label; }, 2200);
}

/* ---------- interactions globales ---------- */
document.getElementById("q").addEventListener("input", e=>{ state.q = e.target.value; render(); });
document.querySelectorAll(".filter button").forEach(b=>{
  b.addEventListener("click", ()=>{
    const s = b.dataset.sev; state.sev[s] = !state.sev[s];
    b.setAttribute("aria-pressed", String(!!state.sev[s]));
    render();
  });
});
document.getElementById("pvBtn").addEventListener("click", openPV);
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Effacer tous les constats et repartir d'un véhicule vierge ?")) return;
  state.points = {}; state.block = 0; state.q=""; state.sev={};
  document.getElementById("q").value="";
  document.querySelectorAll(".filter button").forEach(b=>b.setAttribute("aria-pressed","false"));
  save(); render(); window.scrollTo({top:0});
});
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark" : (matchMedia("(prefers-color-scheme: dark)").matches ? "light":"dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("ct2026-theme", next); }catch(e){}
});
try{ const th = localStorage.getItem("ct2026-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}

document.getElementById("stats").textContent = DATA.length+" blocs · "+NPTS+" points de contrôle · "+NDEF+" défaillances";
load(); bindVehicle(); render();
</script>
</body>
